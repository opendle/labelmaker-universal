name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Quality gates
        run: npm run check
      - name: Electron UI smoke test
        run: npm run ui:screenshot
      - name: Mobile responsive checks
        run: npm run responsive:screenshots && npm run mobile:image-print-check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-31" "platforms;android-36" "build-tools;36.0.0"
      - name: Android gates
        run: npm run android:check
      - name: Android release packages
        run: apps/android/gradlew -p apps/android bundlePlayRelease assembleDirectRelease

  android-emulator:
    needs: android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 31
            profile: pixel_6
          - api-level: 36
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: npm ci
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: npm run android:connected-check

  apple-mobile:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        device-family:
          - iphone
          - ipad
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Select an installed Apple simulator
        id: simulator
        run: echo "id=$(node scripts/select-ios-simulator.mjs ${{ matrix.device-family }})" >> "$GITHUB_OUTPUT"
      - name: Apple mobile simulator tests
        run: >-
          xcodebuild
          -project apps/ipad/Labelmaker.xcodeproj
          -scheme Labelmaker
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          CODE_SIGNING_ALLOWED=NO
          test
